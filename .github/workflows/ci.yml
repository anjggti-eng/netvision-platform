name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write # OIDC → AWS (sem chaves estáticas)
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  no-static-secrets:
    name: guarda contra segredos estáticos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nenhum AWS_SECRET_ACCESS_KEY com valor literal no workflow
        run: |
          if grep -RE "AWS_SECRET_ACCESS_KEY *[:=] *[A-Za-z0-9/+]{10}" .github/; then
            echo "FAIL: credencial estática encontrada no workflow" >&2
            exit 1
          fi
          echo "PASS: sem credenciais estáticas"

  terraform:
    name: fmt / validate / tflint / plan
    runs-on: ubuntu-latest
    needs: no-static-secrets
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      - name: bootstrap validate
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate

      - name: env validate
        run: |
          terraform -chdir=infra/envs/prod init -backend=false -input=false
          terraform -chdir=infra/envs/prod validate

      - name: tflint
        run: |
          tflint --chdir=infra/bootstrap --init
          tflint --chdir=infra/bootstrap
          tflint --chdir=infra/envs/prod --init
          tflint --chdir=infra/envs/prod

      - name: Configure AWS credentials (OIDC)
        id: aws
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: terraform plan + checks de custo/segurança
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: |
          cp infra/envs/prod/terraform.tfvars.example infra/envs/prod/terraform.tfvars
          terraform -chdir=infra/envs/prod init -backend=false -input=false
          terraform -chdir=infra/envs/prod plan -input=false -out=tfplan
          scripts/check_no_nat.sh infra/envs/prod/tfplan

      - name: plan pulado (sem AWS_ROLE_ARN)
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        run: echo "::notice::Variável AWS_ROLE_ARN não definida — plan pulado. Ver docs/runbook.md."

  manifests:
    name: kubeconform / alertas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: instalar kustomize + kubeconform
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar -xz -C /usr/local/bin kustomize
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz -C /usr/local/bin kubeconform
      - name: kubeconform (strict)
        run: make kubeconform
      - name: checks de alertas e dashboards
        run: ./scripts/check_alerts.sh

  app:
    name: app / test / build / trivy
    runs-on: ubuntu-latest
    needs: no-static-secrets
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        working-directory: apps/netvision
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/netvision/package-lock.json

      - name: testes (vitest)
        run: npm ci --no-audit --no-fund && npm test

      - name: build (tsc)
        run: npm run build

      - name: docker build
        run: docker build -t netvision:ci .

      - name: trivy (HIGH/CRITICAL bloqueia)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: netvision:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push imagem
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag netvision:ci ghcr.io/anjggti-eng/netvision:latest
          docker tag netvision:ci ghcr.io/anjggti-eng/netvision:${{ github.sha }}
          docker push ghcr.io/anjggti-eng/netvision:latest
          docker push ghcr.io/anjggti-eng/netvision:${{ github.sha }}

      - name: creds AWS (OIDC)
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: rollout restart via SSM (sem cluster ativo = skip)
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=netvision-k3s" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text | awk '{print $1}')
          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "::notice::cluster não está rodando (custo ~zero) — rollout pulado"
            exit 0
          fi
          CMD=$(aws ssm send-command --instance-id "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["k3s kubectl -n netvision rollout restart deploy/netvision","k3s kubectl -n netvision rollout status deploy/netvision --timeout=120s"]' \
            --query 'Command.CommandId' --output text)
          sleep 12
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
