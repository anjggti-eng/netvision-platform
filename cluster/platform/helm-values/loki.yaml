# loki — single binary, filesystem, footprint mínimo (1 nó spot).
deploymentMode: SingleBinary

loki:
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  commonConfig:
    replication_factor: 1

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

read:
  enabled: false

write:
  enabled: false

backend:
  enabled: false

ingester:
  enabled: false

querier:
  enabled: false

distributor:
  enabled: false

compactor:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false

test:
  enabled: false
