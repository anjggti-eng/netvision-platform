# kube-prometheus-stack — retenção curta (custo/disco) + Loki como fonte de logs.
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: "8GB"
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  # senha de demo — troque no primeiro login; ver docs/runbook.md
  adminPassword: grafana-admin
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
    datasources:
      enabled: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      editable: true
  # uid fixo para os dashboards em cluster/platform/monitoring/dashboards
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-kube-prometheus-prometheus.monitoring:9090
          isDefault: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
