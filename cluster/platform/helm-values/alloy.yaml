# alloy — DaemonSet que envia logs de todos os pods para o Loki.
alloy:
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

  alloy:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

controller:
  type: daemonSet
