apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nv-pod-down
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: netvision-platform
spec:
  groups:
    - name: netvision.workload
      rules:
        - alert: PodNotRunning
          expr: |
            kube_pod_status_phase{phase=~"Failed|Pending|Unknown",namespace!~"kube-system|argocd"} > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} em fase {{ $labels.phase }}"
            description: "O pod está em {{ $labels.phase }} há mais de 2 minutos."
            runbook_url: "https://github.com/anjggti-eng/netvision-platform/blob/main/docs/runbook.md"
