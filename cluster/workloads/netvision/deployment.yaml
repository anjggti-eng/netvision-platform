apiVersion: apps/v1
kind: Deployment
metadata:
  name: netvision
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netvision
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netvision
        app.kubernetes.io/part-of: netvision-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: netvision
          image: ghcr.io/anjggti-eng/netvision:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # modo simulado por default; para MikroTik real, crie a secret netvision-mikrotik
            - name: SIMULATE
              value: "1"
            - name: MIKROTIK_HOST
              valueFrom:
                secretKeyRef:
                  name: netvision-mikrotik
                  key: host
                  optional: true
            - name: MIKROTIK_USER
              valueFrom:
                secretKeyRef:
                  name: netvision-mikrotik
                  key: user
                  optional: true
            - name: MIKROTIK_PASS
              valueFrom:
                secretKeyRef:
                  name: netvision-mikrotik
                  key: password
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
